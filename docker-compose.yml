version: '3.8'

services:
  nemo-guardrails-api:
    build:
      context: .
      dockerfile: Dockerfile-simple
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs  # Optional: for log persistence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nemo-guardrails-api
    restart: unless-stopped
    # Uncomment below section if you want to use nginx
