version: '3.8'

services:
  nemo-guardrails-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nemo-guardrails-soar-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      # Optional: Mount logs directory for persistent logging
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nemo-guardrails-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nemo-guardrails.rule=Host(`localhost`)"
      - "traefik.http.services.nemo-guardrails.loadbalancer.server.port=5000"

  # Optional: Nginx reverse proxy for production deployment
  nginx-proxy:
    image: nginx:alpine
    container_name: nemo-guardrails-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Optional SSL certificates
      - ./nginx-logs:/var/log/nginx
    depends_on:
      nemo-guardrails-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nemo-guardrails-network
    profiles:
      - proxy  # Use: docker-compose --profile proxy up
    labels:
      - "description=Nginx reverse proxy for NeMo Guardrails API"

  # Optional: Redis for caching and rate limiting (if scaling needed)
  redis-cache:
    image: redis:7-alpine
    container_name: nemo-guardrails-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    restart: unless-stopped
    networks:
      - nemo-guardrails-network
    profiles:
      - cache  # Use: docker-compose --profile cache up
    labels:
      - "description=Redis cache for NeMo Guardrails API"

  # Optional: Monitoring with Prometheus metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: nemo-guardrails-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - nemo-guardrails-network
    profiles:
      - monitoring  # Use: docker-compose --profile monitoring up

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: nemo-guardrails-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - nemo-guardrails-network
    profiles:
      - monitoring

networks:
  nemo-guardrails-network:
    driver: bridge
    name: nemo-guardrails-net

volumes:
  redis_data:
    driver: local
    labels:
      - "description=Redis data storage"
  prometheus_data:
    driver: local
    labels:
      - "description=Prometheus metrics storage"
  grafana_data:
    driver: local
    labels:
      - "description=Grafana dashboard storage"
